version: '3.8'

services:
  # --- API GATEWAY ---
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=Taller2026 
      - AUTH_SERVICE_URL=http://auth_service:8001
      - MATERIA_SERVICE_URL=http://materia-service:8002
      - ADVISOR_SERVICE_URL=http://advisor-service:8003
      - REVIEW_SERVICE_URL=http://review-service:8004
      - CALENDAR_SERVICE_URL=http://calendar-service:8007
    # Eliminamos depends_on para evitar que el fallo de uno detenga al Gateway

  # --- MICROSERVICIOS ---

  auth_service:
    build: ./auth_service
    container_name: auth_service
    expose:
      - "8001"
    environment:
      - DATABASE_URL=mysql+pymysql://admin:contrasena12345@db-sistema.cvjyu96ahzvc.us-east-1.rds.amazonaws.com:3306/asesorias
      - JWT_SECRET=Taller2026

  advisor-service:
    build: ./advisor-service
    container_name: advisor-service
    expose:
      - "8003"
    environment:
      - DATABASE_URL=mysql+pymysql://admin:contrasena12345@db-sistema.cvjyu96ahzvc.us-east-1.rds.amazonaws.com:3306/asesor_db
      - JWT_SECRET=Taller2026
  
  calendar-service:
    build: ./calendar-service
    container_name: calendar-service
    expose:
      - "8007"
    environment:
      - DATABASE_URL=mysql+pymysql://admin:contrasena12345@db-sistema.cvjyu96ahzvc.us-east-1.rds.amazonaws.com:3306/asesor_db
      - JWT_SECRET=Taller2026

  materia-service:
    build: ./materia-service
    container_name: materia-service
    expose:
      - "8002"
